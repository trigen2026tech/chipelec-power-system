<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CHIPELEC Power System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <script src="js/api.js"></script>
    <script>
        requireCustomerLogin();
        const customer = getCustomerData();
    </script>
    
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">CHIPELEC<span>.</span></a>
            <button class="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('show')">
                <i class="fas fa-bars"></i>
            </button>
            <div class="nav-links d-none d-md-flex">
                <a href="#" class="d-flex align-items-center gap-2"><i class="fas fa-user-circle"></i> <span id="navCustomerName">Customer</span></a>
                <a href="#" onclick="customerLogout()" class="btn btn-outline">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li><a href="customer-dashboard.html" class="active"><i class="fas fa-home"></i> Overview</a></li>
                <li><a href="products.html"><i class="fas fa-box-open"></i> Products</a></li>
                <li><a href="installation.html"><i class="fas fa-tools"></i> Installations</a></li>
                <li><a href="service-request.html"><i class="fas fa-wrench"></i> Service Requests</a></li>
                <li><a href="quotation.html"><i class="fas fa-file-invoice"></i> Quotations</a></li>
                <li><a href="enquiry.html"><i class="fas fa-question-circle"></i> Enquiries</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <a href="#" onclick="customerLogout()" class="btn btn-secondary" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </aside>
        
        <main class="main-content">
            <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-4">
                <div>
                    <h1>Welcome back, <span id="welcomeName">Customer</span>!</h1>
                    <p>Customer ID: #<span id="displayCustomerId"></span></p>
                </div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon primary"><i class="fas fa-box"></i></div>
                    <div class="stat-content">
                        <h3 id="statProducts">0</h3>
                        <p>My Products</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon warning"><i class="fas fa-tools"></i></div>
                    <div class="stat-content">
                        <h3 id="statInstallations">0</h3>
                        <p>Active Installations</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon success"><i class="fas fa-check-circle"></i></div>
                    <div class="stat-content">
                        <h3 id="statComplaints">0</h3>
                        <p>Open Complaints</p>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Recent Activity</h3>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recentActivityBody">
                            <tr><td colspan="5" class="text-center p-4">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(customer) {
                document.getElementById('navCustomerName').textContent = customer.full_name;
                const firstName = customer.full_name.split(' ')[0];
                document.getElementById('welcomeName').textContent = firstName;
                document.getElementById('displayCustomerId').textContent = customer.id;

                try {
                    const response = await window.api.customerAuth.getDashboardStats();
                    if(response.success) {
                        const stats = response.data;
                        document.getElementById('statProducts').textContent = stats.myProducts;
                        document.getElementById('statInstallations').textContent = stats.activeInstallations;
                        document.getElementById('statComplaints').textContent = stats.openComplaints;

                        const tbody = document.getElementById('recentActivityBody');
                        tbody.innerHTML = '';
                        
                        if(stats.recentActivity.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="5" class="text-center p-4">No recent activity found.</td></tr>';
                        } else {
                            stats.recentActivity.forEach(act => {
                                const tr = document.createElement('tr');
                                
                                let badgeClass = 'badge-default';
                                const status = act.status.toLowerCase();
                                if(status.includes('completed') || status.includes('resolved') || status.includes('approved')) {
                                    badgeClass = 'badge-completed';
                                } else if(status.includes('scheduled') || status.includes('assigned')) {
                                    badgeClass = 'badge-scheduled';
                                } else if(status.includes('pending')) {
                                    badgeClass = 'badge-pending';
                                } else if(status.includes('cancelled') || status.includes('rejected')) {
                                    badgeClass = 'badge-cancelled';
                                } else if(status.includes('in progress')) {
                                    badgeClass = 'badge-in-progress';
                                }
                                
                                const dateStr = act.date ? new Date(act.date).toLocaleDateString() : 'N/A';
                                
                                tr.innerHTML = `
                                    <td>#${act.type === 'Installation' ? 'INS' : 'SRV'}-${act.id}</td>
                                    <td>${act.type}</td>
                                    <td>${dateStr}</td>
                                    <td><span class="badge ${badgeClass}">${act.status}</span></td>
                                    <td><a href="${act.type === 'Installation' ? 'installation.html' : 'service-request.html'}" class="btn btn-secondary" style="padding: 4px 12px; font-size: 12px;">View</a></td>
                                `;
                                tbody.appendChild(tr);
                            });
                        }
                    }
                } catch(err) {
                    console.error(err);
                    document.getElementById('recentActivityBody').innerHTML = '<tr><td colspan="5" class="text-center p-4 text-danger">Failed to load data.</td></tr>';
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CHIPELEC Power System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .dashboard-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 80px); /* minus navbar */
        }
        .sidebar {
            background: var(--white);
            border-right: 1px solid var(--gray-light);
            padding: 30px 20px;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
        }
        .sidebar-nav li {
            margin-bottom: 10px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: var(--gray-medium);
            border-radius: 6px;
            font-weight: 500;
        }
        .sidebar-nav a i {
            margin-right: 15px;
            width: 20px;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background: rgba(19, 75, 66, 0.05);
            color: var(--primary-color);
        }
        .main-content {
            padding: 40px;
            background: var(--bg-color);
        }
        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(202, 118, 58, 0.1);
            color: var(--secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        
        @media (max-width: 768px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none; /* Hide sidebar on mobile for simplicity in this demo */
            }
        }
    </style>
</head>
<body>
    <script src="js/api.js"></script>
    <script>
        requireCustomerLogin();
        const customer = getCustomerData();
    </script>
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center" style="max-width: 100%;">
            <a href="index.html" class="navbar-brand">CHIPELEC<span>.</span></a>
            <div class="nav-links">
                <a href="#" style="font-weight: 600;"><i class="fas fa-user-circle"></i> <span id="navCustomerName">Customer</span></a>
                <a href="#" onclick="customerLogout()" class="btn btn-outline" style="padding: 6px 15px; font-size: 0.9rem;">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <ul class="sidebar-nav">
                <li><a href="customer-dashboard.html" class="active"><i class="fas fa-home"></i> Overview</a></li>
                <li><a href="installation.html"><i class="fas fa-tools"></i> Installations</a></li>
                <li><a href="service-request.html"><i class="fas fa-wrench"></i> Service Requests</a></li>
                <li><a href="quotation.html"><i class="fas fa-file-invoice"></i> Quotations</a></li>
                <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 style="color: var(--primary-color);">Welcome back, <span id="welcomeName">Customer</span>!</h2>
                <span style="color: var(--gray-medium);">Customer ID: #<span id="displayCustomerId"></span></span>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin-bottom: 40px;">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-box"></i></div>
                    <div>
                        <h3 id="statProducts" style="font-size: 1.8rem; margin: 0; color: var(--dark-text);">0</h3>
                        <p style="color: var(--gray-medium); margin: 0;">My Products</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-tools"></i></div>
                    <div>
                        <h3 id="statInstallations" style="font-size: 1.8rem; margin: 0; color: var(--dark-text);">0</h3>
                        <p style="color: var(--gray-medium); margin: 0;">Active Installations</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-check-circle" style="color: var(--success-color);"></i></div>
                    <div>
                        <h3 id="statComplaints" style="font-size: 1.8rem; margin: 0; color: var(--dark-text);">0</h3>
                        <p style="color: var(--gray-medium); margin: 0;">Open Complaints</p>
                    </div>
                </div>
            </div>
            
            <div class="card p-4">
                <h3 style="margin-bottom: 20px; color: var(--primary-color);">Recent Activity</h3>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--gray-light); color: var(--gray-medium);">
                                <th style="padding: 15px 10px;">ID</th>
                                <th style="padding: 15px 10px;">Type</th>
                                <th style="padding: 15px 10px;">Date</th>
                                <th style="padding: 15px 10px;">Status</th>
                                <th style="padding: 15px 10px;">Action</th>
                            </tr>
                        </thead>
                        <tbody id="recentActivityBody">
                            <tr><td colspan="5" style="padding: 15px 10px; text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if(customer) {
                document.getElementById('navCustomerName').textContent = customer.full_name;
                const firstName = customer.full_name.split(' ')[0];
                document.getElementById('welcomeName').textContent = firstName;
                document.getElementById('displayCustomerId').textContent = customer.id;

                try {
                    const response = await window.api.customerAuth.getDashboardStats();
                    if(response.success) {
                        const stats = response.data;
                        document.getElementById('statProducts').textContent = stats.products;
                        document.getElementById('statInstallations').textContent = stats.active_installations;
                        document.getElementById('statComplaints').textContent = stats.open_complaints;

                        const tbody = document.getElementById('recentActivityBody');
                        tbody.innerHTML = '';
                        
                        if(stats.recent_activity.length === 0) {
                            tbody.innerHTML = '<tr><td colspan="5" style="padding: 15px 10px; text-align: center;">No recent activity found.</td></tr>';
                        } else {
                            stats.recent_activity.forEach(act => {
                                const tr = document.createElement('tr');
                                tr.style.borderBottom = '1px solid var(--gray-light)';
                                
                                let statusColor = '';
                                let statusBg = '';
                                if(act.status === 'Completed' || act.status === 'Resolved') {
                                    statusBg = '#dcfce7'; statusColor = '#166534';
                                } else if(act.status === 'Scheduled' || act.status === 'Assigned') {
                                    statusBg = '#fef08a'; statusColor = '#854d0e';
                                } else {
                                    statusBg = '#f1f5f9'; statusColor = '#475569';
                                }
                                
                                const dateStr = act.date ? new Date(act.date).toLocaleDateString() : 'N/A';
                                
                                tr.innerHTML = `
                                    <td style="padding: 15px 10px;">#${act.type === 'Installation' ? 'INS' : 'SRV'}-${act.id}</td>
                                    <td style="padding: 15px 10px;">${act.type}</td>
                                    <td style="padding: 15px 10px;">${dateStr}</td>
                                    <td style="padding: 15px 10px;"><span style="background: ${statusBg}; color: ${statusColor}; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;">${act.status}</span></td>
                                    <td style="padding: 15px 10px;"><a href="${act.type === 'Installation' ? 'installation.html' : 'service-request.html'}" style="color: var(--secondary-color);">View</a></td>
                                `;
                                tbody.appendChild(tr);
                            });
                        }
                    }
                } catch(err) {
                    console.error(err);
                    document.getElementById('recentActivityBody').innerHTML = '<tr><td colspan="5" style="padding: 15px 10px; text-align: center; color: red;">Failed to load data.</td></tr>';
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Quotation | CHIPELEC Power System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand">CHIPELEC<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="btn btn-outline" style="padding: 8px 20px;">Login</a>
            </div>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <header class="py-5 text-center" style="background-color: var(--primary-color); color: white;">
        <div class="container">
            <h1 style="color: white; font-size: 2.5rem;">Request a Quotation</h1>
            <p style="color: #e2e8f0; max-width: 600px; margin: 10px auto 0;">Get customized pricing for bulk orders or enterprise solutions.</p>
        </div>
    </header>

    <main class="py-5" style="background-color: var(--bg-color);">
        <div class="container" style="max-width: 800px;">
            <div class="card" style="padding: 40px;">
                <form id="quoteForm">
                    <h3 style="margin-bottom: 20px; color: var(--primary-color); border-bottom: 2px solid var(--gray-light); padding-bottom: 10px;">Your Requirements</h3>
                    <div class="form-group">
                        <label class="form-label">Name / Company Name *</label>
                        <input type="text" id="quoteName" class="form-control" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">Email *</label>
                            <input type="email" id="quoteEmail" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone *</label>
                            <input type="tel" id="quotePhone" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Requirement Details *</label>
                        <textarea class="form-control" rows="5" required placeholder="Specify products, quantities, and capacity needed"></textarea>
                    </div>
                    
                    <div id="alertBox" style="display: none; padding: 15px; border-radius: 6px; margin-bottom: 20px; font-weight: 500;"></div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary" style="padding: 15px 40px; font-size: 1.1rem; width: 100%;">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col"><h3>CHIPELEC.</h3></div>
                <div class="footer-col">
                    <h3>Quick Links</h3>
                    <ul><li><a href="about.html">About Us</a></li><li><a href="products.html">Products</a></li></ul>
                </div>
            </div>
            <div class="footer-bottom"><p>&copy; 2026 CHIPELEC Power System. All rights reserved.</p></div>
        </div>
    </footer>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Enforce login
        requireCustomerLogin();
        const customer = getCustomerData();

        document.addEventListener('DOMContentLoaded', () => {
            // Pre-fill data
            if(customer) {
                const nameInput = document.getElementById('quoteName');
                const emailInput = document.getElementById('quoteEmail');
                const phoneInput = document.getElementById('quotePhone');
                
                if(nameInput) {
                    nameInput.value = customer.full_name;
                    nameInput.readOnly = true;
                }
                if(emailInput) {
                    emailInput.value = customer.email;
                    emailInput.readOnly = true;
                }
                if(phoneInput) {
                    phoneInput.value = customer.phone;
                    phoneInput.readOnly = true;
                }
            }
        });

        document.getElementById('quoteForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = '#dcfce7';
            alertBox.style.color = '#166534';
            alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Quotation request submitted successfully! (Frontend Mock)';
            e.target.reset();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | CHIPELEC Power System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="index.html" class="navbar-brand">CHIPELEC<span>.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="products.html">Products</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="btn btn-outline" style="padding: 8px 20px;">Login</a>
            </div>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <header class="py-5 text-center" style="background-color: var(--primary-color); color: white;">
        <div class="container">
            <h1 style="color: white; font-size: 2.5rem;">Submit an Enquiry</h1>
            <p style="color: #e2e8f0; max-width: 600px; margin: 10px auto 0;">Have a question about a product or service? Let us know!</p>
        </div>
    </header>

    <main class="py-5" style="background-color: var(--bg-color);">
        <div class="container" style="max-width: 800px;">
            <div class="card p-4 animate-fade-in" style="padding: 40px;">
                <div id="enquiryAlert" style="display: none; padding: 15px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-weight: 600;"></div>
                
                <form id="enquiryForm">
                    <div class="form-group d-flex gap-3">
                        <div style="flex: 1;">
                            <label class="form-label" for="full_name">Full Name *</label>
                            <input type="text" id="full_name" class="form-control" required>
                        </div>
                        <div style="flex: 1;">
                            <label class="form-label" for="phone">Phone Number *</label>
                            <input type="tel" id="phone" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="subject">Subject / Product of Interest *</label>
                        <input type="text" id="subject" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">Message *</label>
                        <textarea id="message" class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 15px;" id="submitBtn">Submit Enquiry</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 CHIPELEC Power System. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('product');
            const subjectField = document.getElementById('subject');
            
            if(productId) {
                subjectField.value = `Enquiry for Product ID: ${productId}`;
                // Optionally fetch product name if needed, but for now ID is fine.
            }

            document.getElementById('enquiryForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                const alertBox = document.getElementById('enquiryAlert');
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';
                
                const data = {
                    full_name: document.getElementById('full_name').value,
                    phone: document.getElementById('phone').value,
                    email: document.getElementById('email').value,
                    subject: document.getElementById('subject').value,
                    message: document.getElementById('message').value
                };

                try {
                    const res = await fetch('/api/enquiries', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    
                    const result = await res.json();
                    
                    if(result.success) {
                        alertBox.style.display = 'block';
                        alertBox.style.backgroundColor = '#dcfce7';
                        alertBox.style.color = '#166534';
                        alertBox.textContent = 'Enquiry submitted successfully! Our team will contact you soon.';
                        document.getElementById('enquiryForm').reset();
                    } else {
                        throw new Error(result.message || 'Failed to submit enquiry');
                    }
                } catch(err) {
                    alertBox.style.display = 'block';
                    alertBox.style.backgroundColor = '#fee2e2';
                    alertBox.style.color = '#b91c1c';
                    alertBox.textContent = err.message;
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Submit Enquiry';
                }
            });
        });
    </script>
</body>
</html>

</head>

<body>

    <h2>CHIPELEC</h2>

    <a href="dashboard.html">📊 Dashboard</a>

<div class="content">

<h1>Service Requests</h1>

<button onclick="showForm()">+ New Service Request</button>

<table>

<thead>

<tr>

<th>ID</th>
<th>Customer</th>
<th>Type</th>
<th>Date</th>
<th>Status</th>
<th>Technician</th>
<th>Charge</th>
<th>Action</th>

</tr>

</thead>

<tbody id="serviceTable">

</tbody>

</table>

<!-- Modal -->
<!-- Modal -->
<div class="modal" id="serviceModal">

    <div class="modal-content">

        <h2>Service Request</h2>

        <select id="customer_id"></select>

        <select id="request_type">
            <option>Battery Service</option>
            <option>Inverter Service</option>
            <option>Installation</option>
            <option>Maintenance</option>
            <option>Other</option>
        </select>

        <input type="date" id="request_date">

        <textarea
            id="issue_description"
            placeholder="Issue Description">
        </textarea>

        <select id="service_status">
            <option>Pending</option>
            <option>Assigned</option>
            <option>In Progress</option>
            <option>Completed</option>
            <option>Cancelled</option>
        </select>

        <input
            type="text"
            id="technician_name"
            placeholder="Technician Name">

        <input
            type="number"
            id="service_charge"
            placeholder="Service Charge">

        <button onclick="saveServiceRequest()">Save</button>
        <button onclick="closeModal()">Cancel</button>

    </div>

</div>
<script src="js/auth.js"></script>
<script src="js/serviceRequests.js"></script>

</body>
</html>

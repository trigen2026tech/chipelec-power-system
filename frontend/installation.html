<div class="content">

<h1>Installation Management</h1>

<button onclick="showForm()">+ New Installation</button>

<table>

<thead>

<tr>

<th>Customer</th>
<th>Product</th>
<th>Date</th>
<th>Technician</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody id="installationTable">

</tbody>

</table>

</div>

<!-- Modal -->

<div class="modal" id="installationModal">

<div class="modal-content">

<h2>Installation</h2>

<select id="customer_id"></select>

<select id="product_id"></select>

<input type="date" id="installation_date">

<input
type="text"
id="technician_name"
placeholder="Technician Name">

<textarea
id="installation_address"
placeholder="Installation Address"></textarea>

<select id="installation_status">

<option>Scheduled</option>
<option>Completed</option>
<option>Cancelled</option>

</select>

<textarea
id="remarks"
placeholder="Remarks"></textarea>

<button onclick="saveInstallation()">

Save

</button>

<button onclick="closeModal()">

Cancel

</button>

</div>

</div>

<script src="js/auth.js"></script>
<script src="js/installations.js"></script>

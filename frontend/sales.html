<html lang="en">
<head>

<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div class="sidebar">

    <h2>CHIPELEC</h2>

    <a href="dashboard.html">📊 Dashboard</a>
    <a href="products.html">📦 Products</a>
    <a href="brands.html">🏷 Brands</a>
    <a href="categories.html">📂 Categories</a>
    <a href="customers.html">👥 Customers</a>
    <a href="sales.html" class="active">💰 Sales</a>
    <a href="installations.html">🛠 Installations</a>
    <a href="service-requests.html">📞 Service Requests</a>
    <a href="maintenance.html">🔧 Maintenance</a>
    <a href="reports.html">📈 Reports</a>
    <a href="profile.html">👤 Profile</a>
    <a href="#" onclick="logout()">🚪 Logout</a>

</div>

<div class="content">

<h1>Sales Management</h1>

<button onclick="showForm()">+ New Sale</button>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Product</th>
            <th>Qty</th>
            <th>Unit Price</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="salesTable"></tbody>
</table>

<!-- Modal -->
<div class="modal" id="salesModal">
    <div class="modal-content">
        <h2>Sale</h2>

        <select id="customer_id"></select>
        <select id="product_id"></select>

        <input type="number" id="quantity" placeholder="Quantity" value="1">
        <input type="number" id="unit_price" placeholder="Unit Price">
        <input type="number" id="total_amount" placeholder="Total Amount" readonly>

        <input type="date" id="sale_date">

        <select id="payment_status">
            <option value="Pending">Pending</option>
            <option value="Paid">Paid</option>
        </select>

        <button onclick="saveSale()">Save</button>
        <button onclick="closeModal()">Cancel</button>
    </div>
</div>
<script src="js/auth.js"></script>
<script src="js/sales.js"></script>

</body>
</html>

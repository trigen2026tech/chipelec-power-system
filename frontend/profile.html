<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile | Chipelec Admin</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 20px;
        }

        .profile-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .button-group button {
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
    </style>

</head>

<body>

<div class="sidebar">

    <h2>CHIPELEC</h2>

    <a href="dashboard.html">📊 Dashboard</a>
    <a href="products.html">📦 Products</a>
    <a href="brands.html">🏷 Brands</a>
    <a href="categories.html">📂 Categories</a>
    <a href="customers.html">👥 Customers</a>
    <a href="sales.html">💰 Sales</a>
    <a href="installations.html">🛠 Installations</a>
    <a href="service-requests.html">📞 Service Requests</a>
    <a href="maintenance.html">🔧 Maintenance</a>
    <a href="reports.html">📈 Reports</a>
    <a href="profile.html" class="active">👤 Profile</a>
    <a href="#" onclick="logout()">🚪 Logout</a>

</div>

<div class="content">

    <h1>My Profile</h1>

    <div class="profile-container">

        <div class="success-message" id="successMessage"></div>
        <div class="error-message" id="errorMessage"></div>

        <div class="profile-header">
            <img src="https://i.pravatar.cc/120" alt="Admin">
            <h2 id="adminUsername">Loading...</h2>
            <p id="adminEmail" style="color: #666;">Loading...</p>
        </div>

        <!-- View Profile Section -->
        <div class="profile-form" id="viewProfileSection">
            <div class="section-title">Account Information</div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="viewUsername" readonly>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="viewEmail" readonly>
            </div>

            <div class="form-group">
                <label>Role</label>
                <input type="text" id="viewRole" readonly>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="showEditForm()">✏️ Edit Profile</button>
            </div>
        </div>

        <!-- Edit Profile Section (Hidden by default) -->
        <div class="profile-form" id="editProfileSection" style="display: none;">
            <div class="section-title">Edit Profile</div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="editUsername">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="editEmail">
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="saveProfile()">💾 Save Changes</button>
                <button class="btn-danger" onclick="cancelEdit()">Cancel</button>
            </div>
        </div>

        <!-- Change Password Section -->
        <div class="profile-form">
            <div class="section-title">Change Password</div>

            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password">
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="changePassword()">🔐 Change Password</button>
            </div>
        </div>

    </div>

</div>

<script src="js/auth.js"></script>
<script src="js/profile.js"></script>

</body>

</html>

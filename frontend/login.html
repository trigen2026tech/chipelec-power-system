<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chipelec Admin Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-box">

        <h2>Chipelec Admin Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()">
            Login
        </button>

        <p id="msg"></p>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
